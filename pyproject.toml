[project]
name = "whiteout"
version = "0.1.0"
description = "Balloon every requirement on an engineering drawing, fill AS9102 forms, and show nothing was missed."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
    "pymupdf>=2.0",
    "pytest>=9.2.0",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
whiteout = "whiteout.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
